<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择伙伴 · Sprunki</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#293d35;font:15px/1.5 -apple-system,"PingFang SC",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 24px}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:17px}nav{display:flex;gap:8px;flex-wrap:wrap}a,button{font:inherit;cursor:pointer}a{color:#426653;text-decoration:none;background:#e7eee5;padding:9px 13px;border-radius:11px}main{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(250px,320px);gap:16px;padding:0 24px 32px}.panel{background:white;border:1px solid #e2e9de;border-radius:18px;padding:16px;min-width:0}.sub{color:#738579;font-size:13px;margin:4px 0 12px}.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}.role,.phase{background:#f7f8f2;border:2px solid transparent;border-radius:12px;padding:6px;min-width:0;color:#30483a}.role.selected,.phase.selected{border-color:#5d9370;background:#edf7ed}.role img{width:100%;height:72px;object-fit:contain;display:block}.role span{font-size:12px;overflow-wrap:anywhere}.phases{display:grid;gap:6px}.phase{display:flex;align-items:center;gap:7px;width:100%;min-height:52px}.phase img{width:34px;height:42px;object-fit:contain;flex-shrink:0}.phase span{white-space:nowrap;font-size:12px}.stage{position:sticky;top:16px;text-align:center}.portrait{width:100%;height:230px;object-fit:contain;background:#eff5e9;border-radius:15px;margin:12px 0}.status{min-height:44px;color:#63796a}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button{border:0;border-radius:10px;padding:11px 18px;background:#426d52;color:white;min-height:44px}.controls button:disabled{opacity:.45;cursor:default}@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) 120px; padding:0 12px 24px;gap:8px}.stage{position:static;grid-column:1/-1;grid-row:1}.portrait{height:140px;margin:6px 0}.roles{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}header{padding:12px}.panel{padding:12px}}@media(max-width:400px){main{grid-template-columns:minmax(0,1fr) 104px}.role img{height:58px}}
/* The player is a centered composition; the gallery and workshop keep their own widths. */
main{width:100%;max-width:1200px;margin:0 auto;padding:18px 20px 32px;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr) minmax(150px,1fr);grid-template-areas:"stage roles phases";gap:16px;align-items:start}
main>section:nth-child(1){grid-area:roles}main>section:nth-child(2){grid-area:phases}.stage{grid-area:stage;grid-column:auto;grid-row:auto;position:sticky;top:16px;align-self:start}.portrait{height:clamp(200px,20vw,250px)}.roles{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}.role img{height:64px}
@media(max-width:760px){main{padding:12px 12px 24px;grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "phases" "roles";gap:10px}.stage{position:static;grid-column:auto;grid-row:auto}.portrait{height:180px;margin:8px 0}.phases{grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px}.roles{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}.role img{height:58px}}
</style><link rel="stylesheet" href="site-nav.css"></head><body><header class="site-header"><a class="site-brand" href="./"><span aria-hidden="true">✳</span> Sprunki 小伙伴</a><nav class="site-nav" aria-label="网站导航"><a href="learning.html">每日资料</a><a href="./">每日画廊</a><a href="player.html" aria-current="page">选伙伴</a><a href="game.html">音乐工坊</a><a href="pvz.html">植物图鉴</a></nav></header><main><section class="panel"><h2>选角色</h2><p class="sub">点头像选择伙伴</p><div class="roles" id="roles"></div></section><section class="panel"><h2>选阶段</h2><p class="sub" id="phase-role"></p><div class="phases" id="phases"></div></section><section class="panel stage"><h2 id="player-title"></h2><img class="portrait" id="portrait" alt=""><p id="status" class="status" role="status">点角色或阶段开始播放</p><div class="controls"><button id="play">▶ 播放</button><button id="stop">■ 停止</button></div></section></main>
<script src="assets/sprunki-music-engine.js?v=f3aa890ff5a1344d"></script><script src="assets/sprunki-role-music.js"></script><script src="assets/catalog.js"></script><script>
const $=s=>document.querySelector(s),catalog=window.MUSIC_CATALOG;let role=catalog.characters.find(r=>r.id==='oren')||catalog.characters[0],phase=role.phases[0],request=0;
const engine=new SprunkiMusicEngine(), adapter={engine,asset:name=>'assets/'+name.split('/').map(encodeURIComponent).join('/')};adapter.ready=fetch('assets/music-timing.json').then(r=>{if(!r.ok)throw Error('节奏资料加载失败');return r.json()}).then(t=>adapter.timing=t);
const music=new SprunkiRoleMusic({getArranger:()=>adapter,onStart:({role,phase})=>{$('#status').textContent=`正在循环播放 ${role.name} · ${phase.name}`},onStop:()=>{$('#status').textContent='已停止'},onError:m=>{$('#status').textContent=m}});
function choose(r,p){role=r;phase=p;draw();if(!p.audio_files?.length){music.stop();$('#status').textContent='这个阶段没有独立音轨，请选择其他阶段或伙伴。';return}$('#status').textContent=`正在准备 ${r.name} · ${p.name} 的音乐…`;music.play(r,p)}
function draw(){const roles=$('#roles');roles.replaceChildren();for(const r of catalog.characters){const b=document.createElement('button');b.className='role'+(r.id===role.id?' selected':'');b.setAttribute('aria-pressed',String(r.id===role.id));const image=document.createElement('img');image.src='assets/'+r.phases[0].asset;image.alt='';image.loading='lazy';const name=document.createElement('span');name.textContent=r.name;b.append(image,name);b.onclick=()=>choose(r,r.phases.find(p=>p.id===phase.id)||r.phases[0]);roles.append(b)}$('#phase-role').textContent=role.name;const phases=$('#phases');phases.replaceChildren();for(const p of role.phases){const b=document.createElement('button');b.className='phase'+(p.id===phase.id?' selected':'');b.setAttribute('aria-pressed',String(p.id===phase.id));b.setAttribute('aria-label',p.name);const image=document.createElement('img');image.src='assets/'+p.asset;image.alt='';const name=document.createElement('span');name.textContent='阶段 '+(p.number??Number(p.id.match(/\d+$/)?.[0]));b.append(image,name);b.onclick=()=>choose(role,p);phases.append(b)}$('#player-title').textContent=role.name+' · '+phase.name;$('#portrait').src='assets/'+phase.asset;$('#portrait').alt=role.name+' '+phase.name;$('#play').disabled=!phase.audio_files?.length}
$('#play').onclick=()=>choose(role,phase);$('#stop').onclick=()=>music.stop();draw();
</script></body></html>
