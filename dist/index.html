<style>

ize:20px}.section-title small{color:#98a197}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fffefa;border:1px solid #e7e8dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #455d4210}.art{display:block;width:100%;padding:0;border-radius:0;background:#e8e9de;overflow:hidden}.art img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .3s}.art:hover img{transform:scale(1.035)}.cardbody{padding:18px}.meta{font-size:11px;letter-spacing:.1em;color:#bf825d;font-weight:800}.card h3{margin:8px 0;font-size:18px}.card p{font-size:13px}.cardfoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#64786a;cursor:pointer}.check input{accent-color:#456e56;width:17px;height:17px}.printone{background:#f3f3e9;color:#4a6652;padding:9px 12px;font-size:13px}.empty{padding:25px;color:#8b8f81}footer{max-width:1320px;margin:auto;padding:0 38px 35px;font-size:12px;color:#9aa59a}dialog{border:0;border-radius:18px;padding:0;max-width:min(1000px,94vw);max-height:92vh;background:#fffefa;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#17281fbb}dialog img{display:block;max-width:100%;max-height:78vh;object-fit:contain;margin:auto}.dialogbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:20px}.dialogbar button{background:#edf1e9}#print-area{display:none}@media(max-width:760px){header{padding:22px 20px 0}.badge{display:none}main{padding:42px 20px 70px}.intro{margin-bottom:28px}.spark{font-size:36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cardbody{padding:13px}.card h3{font-size:15px}.cardfoot{align-items:flex-start;gap:8px;flex-direction:column}.toolbar{align-items:flex-start}.actions{width:100%}footer{padding:0 20px 25px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.cardfoot{flex-direction:row;align-items:center}}
/* Compact gallery with controls over the artwork. */
header{max-width:none;padding:12px 20px}main{max-width:none;padding:6px 20px 48px}.intro{margin:0 0 8px;align-items:center}.intro .eyebrow,.intro p,.spark{display:none}h1{font-size:24px;margin:4px 0}.toolbar{padding:9px 0;gap:8px}.section-title{margin:18px 0 8px!important;align-items:center}.section-title h2{font-size:17px}.secondary,.primary{min-height:40px;padding:8px 12px}.grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{position:relative;border-radius:12px}.art img{aspect-ratio:3/2;object-fit:contain;background:#e8e9de}.cardbody{position:absolute;z-index:1;top:0;left:0;right:0;padding:8px 10px 18px;color:white;background:linear-gradient(#10231de8,#10231d9c 65%,transparent);pointer-events:none}.card h3{font-size:15px;margin:0;line-height:1.3;text-shadow:0 1px 3px #000}.meta,.card p{color:#f1f6ec;font-size:11px;line-height:1.25}.cardfoot{margin:4px 0 0;flex-direction:row;align-items:center;gap:6px}.check,.printone{pointer-events:auto;min-height:38px;color:white;background:#233d34df;border-radius:8px;padding:6px 9px;font-size:12px}.check input{width:18px;height:18px;margin:0}.printone{border:1px solid #ffffff66}footer{max-width:none;padding:0 20px 22px}
dialog{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;box-shadow:none;color:#fff;overflow:hidden}dialog::backdrop{background:#0b1713e8}.dialogbar{position:absolute;z-index:2;top:0;left:0;right:0;padding:12px 18px;background:linear-gradient(#07110ce8,transparent)}.dialogbar button,.nav-arrow{background:#20352de6;color:white;min-width:44px;min-height:44px}.viewer-image{position:absolute;inset:65px 72px 35px;display:flex;align-items:center;justify-content:center;pointer-events:none}.viewer-image img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;pointer-events:auto}.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;z-index:2}.nav-arrow:disabled{opacity:.3;cursor:default}#previous-image{left:14px}#next-image{right:14px}@media(max-width:760px){header{padding:10px 12px;gap:6px}.brand{font-size:13px;white-space:nowrap}.brand span{width:29px;height:29px;margin-right:4px}.game-link{font-size:12px;padding:9px 7px;white-space:nowrap}header nav{display:flex;gap:4px}main{padding:2px 12px 36px}.intro{margin:0}.toolbar{align-items:center}.actions{width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cardbody{padding:6px 7px 14px}.card h3{font-size:13px}.meta,.card p{font-size:10px}.cardfoot{flex-direction:row;align-items:center}.check,.printone{min-height:38px;padding:5px 7px}.viewer-image{inset:70px 42px 35px}#previous-image{left:2px}#next-image{right:2px}.nav-arrow{min-width:38px}}
/* On phones, information and controls sit above the complete image. */
@media(max-width:760px){.card{display:flex;flex-direction:column}.cardbody{position:relative;order:-1;inset:auto;background:#fffefa;color:#273b34;padding:8px;pointer-events:auto}.meta,.card p{color:#73847a}.card h3{color:#273b34;text-shadow:none}.cardfoot{justify-content:space-between}.check,.printone{background:#e9eee5;color:#395f4b;border:0}.art{flex:none}.art img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain}}
@page portrait{size:A4 portrait;margin:8mm}@page landscape{size:A4 landscape;margin:8mm}@media print{body>*:not(#print-area){display:none!important}#print-area{display:block}.sheet{break-after:page;page-break-after:always;width:100%;height:calc(297mm - 16mm);display:flex;align-items:center;justify-content:center}.sheet:last-child{break-after:auto;page-break-after:auto}.sheet.landscape{page:landscape;height:calc(210mm - 16mm)}.sheet.portrait{page:portrait}.sheet img{display:block;max-width:100%;max-height:100%;object-fit:contain}}
</style><link rel="stylesheet" href="site-nav.css"></head><body><header class="site-header"><a class="site-brand" href="./"><span aria-hidden="true">✳</span> Sprunki 小伙伴</a><nav class="site-nav" aria-label="网站导航"><a href="learning.html">每日资料</a><a href="./" aria-current="page">每日画廊</a><a href="player.html">选伙伴</a><a href="game.html">音乐工坊</a></nav></header><main><div class="intro"><div><div class="eyebrow">Everyday, a little wonder ✦</div><h1>每天都有新故事。</h1><p>把喜欢的角色、色彩与想象收藏在这里。向下浏览每一天，也可以把喜欢的作品打印下来。</p></div><div class="spark" aria-hidden="true">✺</div></div><div class="toolbar"><div class="datewrap"><span>所有作品 · 按日期排列</span></div><div class="actions"><button class="secondary" id="select-all">全选所有作品</button><span class="count" id="count" aria-live="polite"></span><button class="primary" id="print-selected" disabled>打印选中</button></div></div><div id="groups"></div></main><footer>用想象力，收藏每一天 ✳ &nbsp;·&nbsp; 原创同人作品</footer><dialog id="preview" aria-label="作品大图"><div class="dialogbar"><strong id="preview-title"></strong><button id="close" aria-label="关闭大图">✕</button></div><button id="previous-image" class="nav-arrow" aria-label="上一张">‹</button><div class="viewer-image"><img id="preview-image" alt=""></div><button id="next-image" class="nav-arrow" aria-label="下一张">›</button></dialog><div id="print-area"></div><script src="data.js"></script><script>
const days=window.GALLERY_DATA||[], items=days.flatMap(d=>d.items), byId=new Map(items.map(i=>[i.id,i])), selected=new Set();let previewIndex=0;const $=s=>document.querySelector(s),groups=$('#groups');
function refresh(){groups.replaceChildren();for(const day of days){const section=document.createElement('section');const heading=document.createElement('div');heading.className='section-title';const h=document.createElement('h2');h.textContent=day.date.replaceAll('-',' / ')+' 的作品';const btn=document.createElement('button');btn.className='secondary';btn.textContent=day.items.every(i=>selected.has(i.id))?'取消当天全选':'全选当天';btn.onclick=()=>{const all=day.items.every(i=>selected.has(i.id));day.items.forEach(i=>all?selected.delete(i.id):selected.add(i.id));refresh()};heading.append(h,btn);const grid=document.createElement('div');grid.className='grid';for(const item of day.items){const card=document.createElement('article');card.className='card';const art=document.createElement('button');art.className='art';art.setAttribute('aria-label',`查看 ${item.title} 大图`);const image=document.createElement('img');image.src=item.src;image.alt=item.title;image.loading='lazy';art.append(image);art.onclick=()=>{showPreview(items.findIndex(i=>i.id===item.id));$('#preview').showModal()};const body=document.createElement('div');body.className='cardbody';const meta=document.createElement('div');meta.className='meta';meta.textContent=item.category;const title=document.createElement('h3');title.textContent=item.title;const style=document.createElement('p');style.textContent=item.style;const foot=document.createElement('div');foot.className='cardfoot';const label=document.createElement('label');label.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(item.id);cb.onchange=()=>{cb.checked?selected.add(item.id):selected.delete(item.id);refresh()};label.append(cb,document.createTextNode(' 选择'));const print=document.createElement('button');print.className='printone';print.textContent='打印 ↗';print.onclick=()=>printItems([item]);foot.append(label,print);body.append(meta,title,style,foot);card.append(art,body);grid.append(card)}section.append(heading,grid);groups.append(section)}update()}
function update(){$('#count').textContent=`已选 ${selected.size} 张`;$('#print-selected').disabled=!selected.size;$('#select-all').textContent=selected.size===byId.size&&byId.size?'取消全选':'全选所有作品'}
function showPreview(index){previewIndex=Math.max(0,Math.min(items.length-1,index));const item=items[previewIndex];if(!item)return;$('#preview-title').textContent=item.title+' · '+(previewIndex+1)+' / '+items.length;$('#preview-image').src=item.src;$('#preview-image').alt=item.title;$('#previous-image').disabled=previewIndex===0;$('#next-image').disabled=previewIndex===items.length-1}
$('#previous-image').onclick=()=>showPreview(previewIndex-1);$('#next-image').onclick=()=>showPreview(previewIndex+1);$('#preview').addEventListener('click',e=>{if(e.target===$('#preview'))$('#preview').close()});$('#preview').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();showPreview(previewIndex+(e.key==='ArrowLeft'?-1:1))}});
$('#select-all').onclick=()=>{if(selected.size===byId.size)selected.clear();else for(const id of byId.keys())selected.add(id);refresh()};$('#print-selected').onclick=()=>printItems([...selected].map(id=>byId.get(id)).filter(Boolean));$('#close').onclick=()=>$('#preview').close();
async function printItems(items){if(!items.length)return;const area=$('#print-area');area.replaceChildren();try{for(const item of items){const img=new Image();img.src=item.src;img.alt=item.title;await img.decode();const page=document.createElement('div');page.className='sheet '+(img.naturalWidth>img.naturalHeight?'landscape':'portrait');page.append(img);area.append(page)}window.print()}catch(e){alert('图片加载失败，请稍后重试。');area.replaceChildren()}}
window.addEventListener('afterprint',()=>$('#print-area').replaceChildren());refresh();
</script></body></html>
