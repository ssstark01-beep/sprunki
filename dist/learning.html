<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ed"><title>每日资料 · Sprunki 小伙伴</title><link rel="stylesheet" href="site-nav.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#273b34;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1200px;margin:auto;padding:36px 24px 70px}.eyebrow{color:#b57546;font-size:12px;letter-spacing:.15em;font-weight:800}h1{font-size:34px;margin:8px 0}p{color:#718075}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-block:1px solid #dedfd3;padding:18px 0;margin:28px 0}select{font:inherit;padding:9px 14px;border:1px solid #cdd6c8;background:#fffefa;border-radius:10px;color:inherit}label{display:flex;align-items:center;gap:12px}.count{font-size:14px;color:#718075}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.card{border:1px solid #e1e6d9;background:#fffefa;border-radius:16px;overflow:hidden}.cover{display:flex;align-items:center;justify-content:center;background:#e9eee5;aspect-ratio:210/250;padding:14px;color:#395f4b;text-decoration:none}.cover img{width:100%;height:100%;object-fit:contain;min-height:0}.body{padding:18px}.card-date{display:block;color:#718075;font-size:13px;margin-bottom:5px}.category{font-size:12px;color:#b57546}h2{font-size:20px;margin:30px 0 14px}h3{font-size:19px;margin:6px 0 16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{padding:9px 13px;border-radius:10px;text-decoration:none;background:#395f4b;color:#fff;font-weight:700;font-size:14px}.actions a.download{background:#e9eee5;color:#395f4b}a:focus-visible,select:focus-visible{outline:3px solid #d79348;outline-offset:3px}.empty{padding:40px 0;color:#718075}footer{max-width:1200px;margin:auto;padding:0 24px 30px;color:#718075;font-size:13px}@media(max-width:600px){main{padding:24px 14px 48px}h1{font-size:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{padding:8px}.body{padding:12px}.card-date{font-size:11px}h3{font-size:16px}.actions{gap:6px}.actions a{padding:9px 10px;font-size:12px;min-height:38px}.toolbar{gap:10px}}
.load-more{display:block;margin:24px auto;padding:12px 24px;border:0;border-radius:10px;background:#e9eee5;color:#395f4b;font:inherit;cursor:pointer}#groups{margin-top:24px}</style></head><body><header class="site-header"><a class="site-brand" href="./"><span aria-hidden="true">✳</span> Sprunki 小伙伴</a><nav class="site-nav" aria-label="网站导航"><a href="learning.html" aria-current="page">每日资料</a><a href="./">每日画廊</a><a href="player.html">选伙伴</a><a href="game.html">音乐工坊</a><a href="pvz.html">植物图鉴</a></nav></header><main><div class="eyebrow">每天一个小发现</div><h1>每日资料</h1><div id="groups" class="grid"></div><noscript>请启用 JavaScript 查看每日资料。</noscript></main><footer>资料会在生成并同步后显示。打印操作不会自动记录为已完成。</footer><script src="learning-data.js?v=4f238c9761e32593"></script><script>
const days=window.LEARNING_DATA||[],groups=document.querySelector('#groups');

const imageObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const img=entry.target;img.src=img.dataset.src;delete img.dataset.src;imageObserver.unobserve(img)}},{rootMargin:'400px'}):null;
function lazyImage(img,src){img.loading='lazy';img.decoding='async';if(imageObserver){img.dataset.src=src;imageObserver.observe(img)}else img.src=src}
function progressiveList(entries,append){let offset=0;const more=document.createElement('button');more.type='button';more.className='load-more';more.textContent='加载更多';groups.after(more);let observer;
function next(){const end=Math.min(offset+12,entries.length);for(;offset<end;offset++)append(entries[offset]);if(offset===entries.length){more.remove();observer?.disconnect()}}
more.onclick=next;next();if(offset<entries.length&&'IntersectionObserver' in window){observer=new IntersectionObserver(e=>{if(e.some(x=>x.isIntersecting))next()},{rootMargin:'500px'});observer.observe(more)}}

const entries=days.flatMap(day=>day.items.map(item=>({day,item})));
progressiveList(entries,({day,item})=>{const card=document.createElement('article');card.className='card';const cover=document.createElement('a');cover.className='cover';cover.href=item.pdf;cover.target='_blank';cover.rel='noopener';cover.setAttribute('aria-label','打开 '+item.title+' PDF');if(item.preview){const img=document.createElement('img');lazyImage(img,item.preview);img.alt=item.title+' 首页';img.loading='lazy';cover.append(img)}else cover.textContent='PDF · '+item.title;
const body=document.createElement('div');body.className='body';const date=document.createElement('time');date.className='card-date';date.dateTime=day.date;date.textContent=day.date.replaceAll('-',' / ');const meta=document.createElement('div');meta.className='category';meta.textContent=item.category+' · PDF';const title=document.createElement('h3');title.textContent=item.title;const actions=document.createElement('div');actions.className='actions';const open=document.createElement('a');open.href=item.pdf;open.target='_blank';open.rel='noopener';open.textContent='阅读 / 打印 ↗';const download=document.createElement('a');download.href=item.pdf;download.download=day.date+'_'+item.title+'.pdf';download.className='download';download.textContent='下载 PDF';actions.append(open,download);body.append(date,meta,title,actions);card.append(cover,body);groups.append(card)});
if(!entries.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='暂时还没有已同步的资料。';groups.append(empty)}
</script></body></html>
